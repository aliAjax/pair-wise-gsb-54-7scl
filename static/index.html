<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>跨海光缆故障与抢修协调</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; margin: 2rem; color: #17212b; }
    main { max-width: 960px; margin: auto; }
    button { padding: .55rem .9rem; cursor: pointer; }
    pre { background: #f4f6f8; padding: 1rem; overflow: auto; border-radius: 8px; }
    .row { display: flex; gap: 1rem; align-items: center; }
  </style>
</head>
<body>
<main>
  <h1>跨海光缆故障与抢修协调</h1>
  <p>最小演示页。完整业务流程通过README中的JSON接口调用。</p>
  <div class="row"><button id="load">加载记录</button><button id="stats">查看状态统计</button></div>
  <h2>四源续作批次同步</h2>
  <div class="row">
    <button id="syncBatches">批次</button>
    <button id="syncView">现场可用量/缺口</button>
    <button id="syncDemands">需求与占用</button>
    <button id="syncConflicts">待裁决冲突</button>
    <button id="syncReconcile">出库/结算对账</button>
  </div>
  <pre id="output">点击上方按钮读取服务状态。</pre>
</main>
<script>
const headers = {"X-User-Id":"demo-admin","X-Role":"admin","X-Org":"demo"};
async function show(path, options) {
  const response = await fetch(path, Object.assign({headers}, options || {}));
  const data = await response.json();
  document.getElementById("output").textContent = JSON.stringify(data, null, 2);
}
document.getElementById("load").onclick = () => show("/api/records?limit=20");
document.getElementById("stats").onclick = () => show("/api/stats");
document.getElementById("syncBatches").onclick = () => show("/api/sync/batches?limit=20");
document.getElementById("syncView").onclick = () => show("/api/sync/availability");
document.getElementById("syncDemands").onclick = () => show("/api/sync/demands");
document.getElementById("syncConflicts").onclick = () => show("/api/sync/conflicts?state=pending");
document.getElementById("syncReconcile").onclick = () => show("/api/sync/reconcile");
</script>
</body>
</html>
